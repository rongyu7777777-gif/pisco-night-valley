  const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const titleFor=i=>scenes[i].presentation?.title||stories[i].t;
  const total=String(scenes.length).padStart(2,'0');
  scenes.forEach((s,i)=>{const button=document.createElement('button');button.setAttribute('aria-label',`Visit ${titleFor(i)}`);button.addEventListener('click',()=>stage.jump(i+.05));$('#steps').append(button);});
  function open(title,html){stage.film=null;stage.rail.target=stage.rail.position;$('#dialogTitle').textContent=title;body.innerHTML=html;dialog.showModal();}
  function worlds(){open('Which story will you make yours?',`<div class="worlds">${scenes.map((s,i)=>`<button class="world" data-world="${i}"><img src="${s.start}" alt="${escape(titleFor(i))}" loading="lazy"><strong>${escape(titleFor(i))}</strong><small>${escape(s.status==='pending'?'Coming soon':s.presentation?.category||stories[i].cat)}</small></button>`).join('')}</div>`);}
  $('#stories').onclick=worlds;$('.brand').onclick=()=>stage.jump(0);
  $('#about').onclick=()=>open('Every story needs you.',`<div class="about"><p>Pisco opens the door to stories of romance, curiosity and possibility.</p><p>Move closer at your own pace. Stay with someone who catches your eye.</p><p class="hint">Scroll, swipe or use the arrow keys to travel. Reverse your gesture to retrace your steps. All characters are adults. These are fictional story previews.</p></div>`);
  $('.close').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close();});
  body.addEventListener('click',e=>{const el=e.target.closest('button');if(el?.dataset.world!==undefined){dialog.close();stage.jump(+el.dataset.world+.08);}});
  $('#sound').onclick=()=>{
    if(audio){audio.ctx.close();audio=null;$('#sound').textContent='Sound off';$('#sound').setAttribute('aria-pressed','false');return;}
    const ctx=new(window.AudioContext||window.webkitAudioContext)(),gain=ctx.createGain();gain.gain.value=.018;gain.connect(ctx.destination);
    [110,164.81,220,329.63].forEach((hz,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=hz;g.gain.value=.3/(i+1);o.connect(g);g.connect(gain);o.start();});audio={ctx,gain};$('#sound').textContent='Sound on';$('#sound').setAttribute('aria-pressed','true');
  };
  function blocked(e){return dialog.open||e.target.closest('button,a,input,dialog');}
  window.addEventListener('wheel',e=>{if(dialog.open||e.ctrlKey||Math.abs(e.deltaX)>Math.abs(e.deltaY))return;e.preventDefault();stage.move(e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?innerHeight:1));},{passive:false});
  window.addEventListener('pointerdown',e=>{if(blocked(e))return;pointer={id:e.pointerId,y:e.clientY};});
  window.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId)return;const delta=pointer.y-e.clientY;pointer.y=e.clientY;stage.move(delta*3);});
  const clear=()=>pointer=null;window.addEventListener('pointerup',clear);window.addEventListener('pointercancel',clear);
  window.addEventListener('keydown',e=>{if(dialog.open||e.target.closest('input,textarea'))return;const dirs={ArrowDown:145,ArrowRight:145,PageDown:480,ArrowUp:-145,ArrowLeft:-145,PageUp:-480};if(e.key in dirs){e.preventDefault();stage.move(dirs[e.key]);}if(e.key==='Home'){e.preventDefault();stage.jump(0);}if(e.key==='End'){e.preventDefault();stage.jump(scenes.length-1+.05);}});
  stage.onframe=f=>{
    const s=stories[f.scene],presentation=scenes[f.scene].presentation||{},key=String(f.scene);
    if(key!==copyKey){copyKey=key;$('#category').textContent=presentation.eyebrow||s.cat;$('#title').textContent=presentation.headline||s.t;$('#line').textContent=presentation.teaser||s.teaser[0];$('#story').dataset.arrival=String(f.scene===0);}
    if(sceneIndex!==f.scene){sceneIndex=f.scene;$('#number').textContent=`${String(f.scene+1).padStart(2,'0')} / ${total}`;$('#chapterName').textContent=presentation.chapter||s.t;$('#scene').setAttribute('aria-label',scenes[f.scene].description);[...$('#steps').children].forEach((el,i)=>el.setAttribute('aria-current',String(i===f.scene)));}
    const compact=innerWidth<=700,textY=f.textY*(compact?.45:1),textScale=1+(f.textScale-1)*(compact?.2:1);
    $('#story').style.opacity=f.opacity;$('#story').style.transform=stage.reduced?'none':`translateY(${textY}px) scale(${textScale})`;
    $('#progress').style.transform=`scaleX(${f.position/scenes.length})`;$('#progress').setAttribute('aria-valuenow',Math.round(f.position/scenes.length*100));$('#cue').textContent=f.transition>0?'Keep moving closer':'Scroll to move closer';
    if(recording)capture(f);
  };
  stage.ready.then(()=>{$('#loading').hidden=true;const id=location.hash.slice(1),i=scenes.findIndex(s=>s.id===id||(s.aliases||[]).includes(id));if(i>=0)stage.jump(i+.05);});
})();
</script></body></html>
