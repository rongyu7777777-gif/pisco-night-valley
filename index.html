    if(sceneIndex!==f.scene){sceneIndex=f.scene;$('#number').textContent=`${String(f.scene+1).padStart(2,'0')} / ${total}`;$('#chapterName').textContent=presentation.chapter||s.t;$('#scene').setAttribute('aria-label',scenes[f.scene].description);[...$('#steps').children].forEach((el,i)=>el.setAttribute('aria-current',String(i===f.scene)));}

    if(shade.dataset.scene!==scenes[f.index].id){shade.dataset.scene=scenes[f.index].id;shade.style.setProperty('--shade-from',scenes[f.index].presentation.shade);shade.style.setProperty('--shade-to',scenes[f.next].presentation.shade);}
    shade.style.setProperty('--shade-mix',JSmooth(f.transition));
    const compact=innerWidth<=700,textY=f.textY*(compact?.45:1),textScale=1+(f.textScale-1)*(compact?.2:1);
    $('#story').style.opacity=f.opacity;$('#story').style.transform=stage.reduced?'none':`translateY(${textY}px) scale(${textScale})`;
    $('#cue').textContent=f.transition>0?'Keep moving closer':'Scroll to move closer';
    if(recording)capture(f);
  };
  stage.ready.then(()=>{const id=location.hash.slice(1),i=scenes.findIndex(s=>s.id===id||(s.aliases||[]).includes(id));if(i>=0)stage.jump(i+.05);});
})();
</script></body></html>
