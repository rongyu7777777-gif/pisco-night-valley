// One continuous camera rail. Input is accumulated; small wheel/drag deltas are
// never discarded, and the narrative reads the travelled position, not events.
class CameraTravel {
  constructor(max=6){this.position=0;this.target=0;this.max=max;}
  push(pixels){this.target=Math.max(0,Math.min(this.max,this.target+pixels/1550));}
  seek(position){this.target=Math.max(0,Math.min(this.max,position));}
  update(dt){this.position+=(this.target-this.position)*(1-Math.exp(-8*Math.max(0,Math.min(dt,.1))));if(Math.abs(this.target-this.position)<.00001)this.position=this.target;return this.position;}
}

// A single description drives the camera, visible story and its entry action.
// The image fracture is a position on the rail, never a timed chapter change.
// Its position and envelope have zero slope at both ends, so starting, reversing
// or stopping cannot spawn a rim or leave fragments at a scene boundary.
function describeTear(transition){
  const t=Math.max(0,Math.min(1,transition));
  const ease=t*t*t*(t*(t*6-15)+10);
  const smooth=x=>{const v=Math.max(0,Math.min(1,x));return v*v*(3-2*v);};
  const caption=1-smooth((t-.12)/.21)+smooth((t-.67)/.19);
  return {open:ease,lift:ease,rim:16*t*t*(1-t)*(1-t),caption};
}
function describeJourney(position,count=6){
  const p=Math.max(0,Math.min(position,count-.000001));
  const from=Math.min(count-1,Math.floor(p)),local=p-from,to=Math.min(count-1,from+1);
  const transition=from===to?0:Math.max(0,Math.min(1,(local-.52)/.48));
  const crossed=transition>=.50,visibleScene=crossed?to:from;
  return {from,to:transition>0?to:from,local,transition,visibleScene,captionOpacity:describeTear(transition).caption,
    phase:crossed?0:Math.min(2,Math.floor(local/.52*3)),
    depthA:local*10,depthB:transition>0?-5*(1-transition):local*10};
}

// Typography is a place on the same rail as the camera, not a timed animation.
// At the identity crossover both text planes are outside the viewport.
function describeTypography(position,count=6,reduced=false){
  const frame=describeJourney(position,count),age=Math.max(-.24,Math.min(1,position-frame.visibleScene));
  const clamp=x=>Math.max(0,Math.min(1,x));
  const smooth=x=>{const t=clamp(x);return t*t*(3-2*t);};
  const captionProgress=Math.max(0,Math.min(2,age/(.52/3)));
  let y=0,scale=1,opacity=1;
  if(age<0){
    const enter=smooth((age+.24)/.24);
    y=90*(1-enter);scale=.78+.22*enter;opacity=smooth((enter-.08)/.28);
  }else{
    const approach=Math.min(age,.52);
    y=-24*approach;scale=1+.24*approach;
    if(frame.visibleScene<count-1){
      const exit=smooth((age-.52)/.24);
      y-=90*exit;scale+=.36*exit;opacity=1-smooth((exit-.65)/.27);
    }
  }
  if(reduced){y=0;scale=1;opacity=1;}
  return {scene:frame.visibleScene,y,scale,opacity,captionProgress:reduced?Math.round(captionProgress):captionProgress,interactive:opacity>.5&&Math.abs(y)<25};
}

// Optional real video loops; the image texture is always the immediate fallback.
class SceneMotion {
  constructor(renderer){
    this.renderer=renderer;this.entries=new Map();this.visible=new Set();
    document.addEventListener('visibilitychange',()=>{
      for(const entry of this.entries.values()){
        if(document.hidden){entry.playRequest++;entry.video.pause();}
        entry.attempted=false;
      }
    });
    addEventListener('pointerdown',()=>{
      for(const entry of this.entries.values())if(entry.blocked){entry.blocked=false;entry.attempted=false;}
    },{passive:true});
  }
  create(index){
    const scene=PISCO_SCENES[index];
    if(!scene.video||!this.renderer.gl)return null;
    const video=document.createElement('video');
    video.muted=true;video.defaultMuted=true;video.loop=true;video.playsInline=true;
    video.preload='auto';video.hidden=true;video.setAttribute('aria-hidden','true');
    video.dataset.sceneMotion=scene.id;video.dataset.motionState='loading';
    const entry={index,video,dirty:false,uploaded:false,attempted:false,blocked:false,failed:false,lastFrame:-1,playRequest:0};
    this.entries.set(index,entry);this.renderer.root.append(video);
    video.addEventListener('loadeddata',()=>{entry.dirty=true;video.dataset.motionState='ready';});
    video.addEventListener('error',()=>{entry.failed=true;video.dataset.motionState='fallback';this.restore(entry);});
    if(video.requestVideoFrameCallback){
      const decoded=()=>{entry.dirty=true;video.requestVideoFrameCallback(decoded);};
      video.requestVideoFrameCallback(decoded);
    }
    video.src=scene.video;
    return entry;
  }
  restore(entry){
    if(!entry.uploaded)return;
    const {gl,sources}=this.renderer,source=sources[entry.index];
    gl.bindTexture(gl.TEXTURE_2D,source.texture);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,source.img);
    entry.uploaded=false;entry.dirty=true;
  }
  update(indices,reduced=false){
    if(!this.renderer.gl)return;
    this.visible=new Set(indices);
    if(!reduced&&!document.hidden)for(const index of this.visible){
      if(!this.entries.has(index))this.create(index);
    }
    for(const entry of this.entries.values()){
      const {video}=entry;
      if(reduced||document.hidden||!this.visible.has(entry.index)||entry.failed){
        if(entry.attempted)entry.playRequest++;
        if(!video.paused)video.pause();entry.attempted=false;
        if(reduced||entry.failed)this.restore(entry);
        if(!entry.failed)video.dataset.motionState=reduced?'reduced':'paused';
        continue;
      }
      if(!entry.attempted&&!entry.blocked){
        entry.attempted=true;
        const request=++entry.playRequest;
        video.play().then(()=>{
          if(request===entry.playRequest)video.dataset.motionState=video.paused?'paused':'playing';
        }).catch(error=>{
          // Scroll/visibility may pause a video before play() has finished.
          // An interrupted or superseded request is not an autoplay denial.
          if(request!==entry.playRequest)return;
          if(error?.name==='AbortError'){
            entry.attempted=false;video.dataset.motionState=video.paused?'paused':'ready';return;
          }
          entry.blocked=true;video.dataset.motionState='fallback';this.restore(entry);
        });
      }
      if(entry.blocked||video.readyState<2)continue;
      const frame=video.getVideoPlaybackQuality?.().totalVideoFrames??video.currentTime;
      const changed=video.requestVideoFrameCallback?entry.dirty:frame!==entry.lastFrame;
      if(!changed)continue;
      const {gl,sources}=this.renderer;
      try{
        gl.bindTexture(gl.TEXTURE_2D,sources[entry.index].texture);
        gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
        gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video);
        entry.uploaded=true;entry.dirty=false;entry.lastFrame=frame;
      }catch{
        entry.failed=true;video.pause();video.dataset.motionState='fallback';this.restore(entry);
      }
    }
  }
}

/* Six cinematic roleplay worlds. Camera travel responds continuously to input;

    if(this.gl){try{this.setup()}catch(e){console.warn('Using the cinematic fallback',e.message);this.gl=null;this.canvas.remove()}}

      this.motion=typeof SceneMotion==='function'?new SceneMotion(this):null;

    addEventListener('resize',()=>this.resize());
    addEventListener('pointermove',e=>{this.pointer=[e.clientX/innerWidth-.5,e.clientY/innerHeight-.5]},{passive:true});

    let texture;if(this.gl){const g=this.gl;texture=g.createTexture();g.bindTexture(g.TEXTURE_2D,texture);g.pixelStorei(g.UNPACK_FLIP_Y_WEBGL,true);g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MIN_FILTER,g.LINEAR);g.texParameteri(g.TEXTURE_2D,g.TEXTURE_MAG_FILTER,g.LINEAR);g.texParameteri(g.TEXTURE_2D,g.TEXTURE_WRAP_S,g.CLAMP_TO_EDGE);g.texParameteri(g.TEXTURE_2D,g.TEXTURE_WRAP_T,g.CLAMP_TO_EDGE);g.texImage2D(g.TEXTURE_2D,0,g.RGBA,g.RGBA,g.UNSIGNED_BYTE,img)}
    this.sources[index]={texture,img};resolve()};img.onerror=()=>reject(Error('A story image could not load.'));img.src=src})}
  scene(index){const source=this.sources[index];return {name:PISCO_SCENES[index].id,index,rect:[0,0,1,1],ratio:source.img.width/source.img.height,focus:PISCO_SCENES[index].focus,...source}}
  set(next){if(!this.current||next.index===this.destination.index)return;this.current=this.destination;this.destination=next;this.transition=0;}
  setHome(index){this.mode='presentation';this.stage=index;if(this.current)this.set(this.scene(index))}
  seekHome(position){this.mode='home';this.travel.seek(position)}
  resumeHome(){this.mode='home'}
  move(pixels){this.mode='home';const finished=pixels>0&&this.travel.position>this.travel.max-.02&&this.travel.target===this.travel.max;this.travel.push(pixels);return finished}
  homeFrame(){
    const f=describeJourney(this.travel.position,PISCO_SCENES.length);
    return {...f,a:this.scene(f.from),b:this.scene(f.to),m:f.transition,da:f.depthA,db:f.depthB,tear:describeTear(f.transition)};
  }
  setStory(index,beat=0){if(this.mode==='home'&&this.current){const f=this.homeFrame();this.current=this.destination=this.scene(f.visibleScene);this.transition=1}this.mode='story';this.stage=beat;if(this.current)this.set(this.scene(index));}
  startHoverTransition(){this.targetHover=1}stopHoverTransition(){this.targetHover=0}
  resize(){const d=Math.min(devicePixelRatio||1,1.5);this.canvas.width=Math.round(innerWidth*d);this.canvas.height=Math.round(innerHeight*d);if(this.gl)this.gl.viewport(0,0,this.canvas.width,this.canvas.height)}
  setup(){const g=this.gl;
    const vertex='attribute vec2 p;varying vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0.,1.);}';
    const fragment=`precision highp float;
      varying vec2 uv;uniform sampler2D a,b;uniform vec4 ar,br;uniform vec2 res,mouse;uniform float aa,ba,af,bf,time,blend,hover,motion,stage,depthA,depthB,cameraZ,journey;uniform vec3 tear;
      float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
      float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}
      float fog(vec2 p){return noise(p)*.55+noise(p*2.03)*.28+noise(p*4.09)*.17;}
      vec2 pictureUV(vec2 coord,float aspect,float focus,float distance,float advance){
        float screen=res.x/res.y;vec2 q=coord-.5;
